<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Balance Sphere: Infinite Dimensions</title>
    <!-- Include Three.js via high-speed CDN -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* High Definition UI Overlay Screens */
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.95) 0%, rgba(2, 6, 23, 0.99) 100%);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        /* Branding Logo Element */
        .game-logo {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.5);
            margin-bottom: 25px;
            animation: float 4s ease-in-out infinite;
            border: 4px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }
        .game-logo::after {
            content: '';
            position: absolute;
            width: 85%;
            height: 85%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            animation: spin 20s linear infinite;
        }
        .game-logo-inner {
            font-size: 55px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        h1 {
            color: #ffffff;
            font-size: 3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: center;
            background: linear-gradient(to right, #fff 20%, #00f2fe 50%, #fff 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
        }
        
        p.subtitle {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 40px;
            max-width: 420px;
            text-align: center;
            line-height: 1.6;
            padding: 0 20px;
        }

        /* HD Glossy Buttons */
        .btn {
            padding: 16px 45px;
            font-size: 1.25rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 40px rgba(0, 242, 254, 0.6);
        }
        .btn:active {
            transform: translateY(-1px);
        }

        /* HUD Overlay Layout */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            color: white;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hud-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 14px;
        }
        .hud-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
        }
        .hud-value {
            font-size: 1.6rem;
            font-weight: 800;
        }

        /* Fullscreen and Exit Control Bar */
        #utility-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
            display: flex;
            gap: 12px;
        }
        .util-btn {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            font-size: 1.2rem;
        }
        .util-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        /* Mobile Responsive Touch Controls */
        #touch-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: none;
            grid-template-columns: repeat(3, 68px);
            grid-template-rows: repeat(2, 68px);
            gap: 10px;
        }
        .joy-btn {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.18);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.4rem;
        }
        .joy-btn:active { background: rgba(56, 189, 248, 0.4); }
        #btn-up { grid-column: 2; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        @media (max-width: 768px) {
            #touch-controls { display: grid; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- WebGL Viewport Container -->
    <div id="canvas-container"></div>

    <!-- Gameplay Live HUD Screen -->
    <div id="hud" class="hidden">
        <div class="hud-card">
            <div class="hud-label">Distance Score</div>
            <div id="score-val" class="hud-value">0</div>
        </div>
        <div class="hud-card">
            <div class="hud-label">Infinite Level</div>
            <div id="level-val" class="hud-value">1</div>
        </div>
    </div>

    <!-- UI Action Interface Bar -->
    <div id="utility-bar">
        <button class="util-btn" id="btn-fullscreen" title="Toggle Fullscreen">⛶</button>
        <button class="util-btn" id="btn-exit" title="Exit to Home">✕</button>
    </div>

    <!-- Logo / Landing Entry Screen -->
    <div id="home-screen" class="ui-screen">
        <div class="game-logo">
            <span class="game-logo-inner">⚽</span>
        </div>
        <h1>Balance Sphere</h1>
        <p class="subtitle">Control the sphere, maintain equilibrium, and navigate through endless procedural pathways.</p>
        <button class="btn" id="btn-play">Play Now</button>
    </div>

    <!-- Game Over Screen Layout -->
    <div id="gameover-screen" class="ui-screen hidden">
        <h1 style="background: linear-gradient(to right, #ff416c, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Sphere Fallen!</h1>
        <p class="subtitle" id="final-stats">You survived up to Level 1.</p>
        <button class="btn" id="btn-restart" style="background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); box-shadow: 0 10px 30px rgba(255, 65, 108, 0.4);">Try Again</button>
    </div>

    <!-- Mobile Virtual Joystick Buttons -->
    <div id="touch-controls">
        <div class="joy-btn" id="btn-up">↑</div>
        <div class="joy-btn" id="btn-left">←</div>
        <div class="joy-btn" id="btn-down">↓</div>
        <div class="joy-btn" id="btn-right">→</div>
    </div>

    <script>
        // Core Physics and Rendering Architecture State Variable setup
        let scene, camera, renderer, ball;
        let platforms = [];
        let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };
        let touchKeys = { up: false, down: false, left: false, right: false };
        let isPlaying = false;
        
        // Physics Engine Constants
        let score = 0;
        let currentLevel = 1;
        let ballVelocity = new THREE.Vector3();
        const gravity = 0.008;
        const speedMultiplier = 0.01;
        const maxVelocity = 0.24;
        
        // Procedural Platform Configuration Fields
        let nextPlatformZ = 0;
        const basePlatformWidth = 5.5;
        const segmentLength = 30;
}
function bindInputEventListeners() {
// Key binding hook configurations
window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });
// Mobile Device Virtual Interface Input touch binding logic setup
const hookTouchSystem = (targetId, mapKey) => {
const element = document.getElementById(targetId);
element.addEventListener('touchstart', (e) => { e.preventDefault(); touchKeys[mapKey] = true; }, {passive: false});
element.addEventListener('touchend', (e) => { e.preventDefault(); touchKeys[mapKey] = false; }, {passive: false});
};
hookTouchSystem('btn-up', 'up');
hookTouchSystem('btn-down', 'down');
hookTouchSystem('btn-left', 'left');
hookTouchSystem('btn-right', 'right');
// Button Click Interface Hooks Setup
document.getElementById('btn-play').addEventListener('click', launchSession);
document.getElementById('btn-restart').addEventListener('click', launchSession);
document.getElementById('btn-exit').addEventListener('click', () => {
isPlaying = false;
hud.classList.add('hidden');
gameoverScreen.classList.add('hidden');
homeScreen.classList.remove('hidden');
});
document.getElementById('btn-fullscreen').addEventListener('click', () => {
if (!document.fullscreenElement) {
document.documentElement.requestFullscreen().catch(() => {});
} else {
document.exitFullscreen();
}
});
}
function onWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
// Initialize App layer on structural window DOM resolution cycles
window.onload = () => {
init3DEngine();
executionCycle();
};
